    <line x1="18" y1="52" x2="62" y2="52" stroke="currentColor" stroke-width="1.2" opacity="0.25"/>
    <circle cx="58" cy="50" r="7" fill="none" stroke="currentColor" stroke-width="2.5"/>
    <line x1="58" y1="46" x2="58" y2="51" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <line x1="62" y1="53" x2="58" y2="51" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <rect x="22" y="66" width="36" height="10" rx="3"
