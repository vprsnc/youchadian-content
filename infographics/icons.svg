<?xml version="1.0" encoding="UTF-8"?>
<!-- Youchadian infographic icon sprite sheet.
     Reference icons in HTML with:
       <svg width="40" height="40"><use href="#icon-id"/></svg>
     Inject into the page with the loader snippet in each infographic's <script>. -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="display:none">

  <!-- ── TEA CATEGORIES ─────────────────────────────────────────── -->

  <!-- Tea leaf: pointed top, wide middle, veined -->
  <symbol id="green-tea" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 5 C32 9 38 18 37 28 C36 37 30 43 24 43
               C18 43 12 37 11 28 C10 18 16 9 24 5Z"/>
      <line x1="24" y1="7"  x2="24" y2="41"/>
      <line x1="24" y1="20" x2="16" y2="29"/>
      <line x1="24" y1="20" x2="32" y2="29"/>
      <line x1="24" y1="30" x2="18" y2="37"/>
      <line x1="24" y1="30" x2="30" y2="37"/>
    </g>
  </symbol>

  <!-- Silver needle bud + two flanking leaves + stem -->
  <symbol id="white-tea" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 5 C27 11 28 20 27 29 C26.5 33 25 36 24 37
               C23 36 21.5 33 21 29 C20 20 21 11 24 5Z"/>
      <path d="M22 31 C18 26 12 28 11 33 C16 32 20 36 22 37"/>
      <path d="M26 31 C30 26 36 28 37 33 C32 32 28 36 26 37"/>
      <line x1="24" y1="37" x2="24" y2="43"/>
    </g>
  </symbol>

  <!-- Leaf with stipple dots — méndūn yellowing shown as surface texture change -->
  <symbol id="yellow-tea" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 7 C31 11 36 20 35 29 C34 37 29 42 24 43
               C19 42 14 37 13 29 C12 20 17 11 24 7Z"/>
      <line x1="24" y1="9"  x2="24" y2="41"/>
      <line x1="24" y1="21" x2="17" y2="30"/>
      <line x1="24" y1="21" x2="31" y2="30"/>
    </g>
    <g fill="currentColor" stroke="none" opacity="0.7">
      <circle cx="19" cy="23" r="1.4"/>
      <circle cx="22" cy="28" r="1.4"/>
      <circle cx="18" cy="33" r="1.4"/>
      <circle cx="21" cy="37" r="1.4"/>
      <circle cx="29" cy="23" r="1.4"/>
      <circle cx="30" cy="29" r="1.4"/>
      <circle cx="27" cy="35" r="1.4"/>
    </g>
  </symbol>

  <!-- Rolled pellet: outer oval + spiral sweep -->
  <symbol id="oolong" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="24" cy="25" rx="16" ry="13"/>
      <path d="M24 14 C33 14 38 19 38 25 C38 31 33 36 24 36
               C17 36 12 32 12 27 C12 22 16 19 21 19"/>
      <path d="M21 19 C24 19 27 21 27 24"/>
    </g>
  </symbol>

  <!-- Wide open leaf (full oxidation) + golden tip dot + strong veins -->
  <symbol id="red-tea" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M24 6 C36 10 43 20 41 31 C39 40 32 45 24 45
               C16 45 9 40 7 31 C5 20 12 10 24 6Z"/>
      <line x1="24" y1="8"  x2="24" y2="43"/>
      <circle cx="24" cy="7" r="3" fill="currentColor" stroke="none"/>
      <line x1="24" y1="20" x2="12" y2="32"/>
      <line x1="24" y1="20" x2="36" y2="32"/>
      <line x1="24" y1="32" x2="15" y2="41"/>
      <line x1="24" y1="32" x2="33" y2="41"/>
    </g>
  </symbol>

  <!-- Pǔ'ěr bing cake — 3/4 angle view showing compressed disc form -->
  <symbol id="dark-tea" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="24" cy="16" rx="17" ry="7"/>
      <line x1="7"  y1="16" x2="7"  y2="25"/>
      <line x1="41" y1="16" x2="41" y2="25"/>
      <path d="M7 25 C7 29.8 14.7 33 24 33 C33.3 33 41 29.8 41 25"/>
      <ellipse cx="24" cy="16" rx="10" ry="4"/>
      <circle cx="24" cy="16" r="2" fill="currentColor" stroke="none"/>
    </g>
  </symbol>


  <!-- ── OOLONG PROCESS STEPS (80×80, photo-traced schematics) ─────── -->
  <!-- Reference photos: 采茶/晒青/做青/杀青/揉捻/烘焙 process shots     -->

  <!-- 1. Picking (采摘) — bud + two broad wing leaves, V silhouette -->
  <symbol id="picking" viewBox="0 0 80 80">
    <line x1="40" y1="52" x2="40" y2="74"
          stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M40 8 C36 16 34 28 34 40 C34 46 36 52 40 52
             C44 52 46 46 46 40 C46 28 44 16 40 8Z"
          fill="currentColor"/>
    <path d="M37 46 C28 40 14 40 8 50 C12 58 28 60 38 54Z"
          fill="currentColor" opacity="0.72"/>
    <path d="M43 46 C52 40 66 40 72 50 C68 58 52 60 42 54Z"
          fill="currentColor" opacity="0.72"/>
  </symbol>

  <!-- 2. Solar Withering (晒青) — prominent sun above bamboo sieve with scattered leaves -->
  <symbol id="solar-withering" viewBox="0 0 80 80">
    <!-- Sun: large prominent circle -->
    <circle cx="40" cy="18" r="11" fill="currentColor" opacity="0.90"/>
    <!-- Sun rays: 8 directions -->
    <line x1="40" y1="3"  x2="40" y2="5"  stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="31" x2="40" y2="33" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="25" y1="18" x2="23" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="55" y1="18" x2="57" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="29" y1="7"  x2="28" y2="6"  stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="51" y1="7"  x2="52" y2="6"  stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="29" y1="29" x2="28" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="51" y1="29" x2="52" y2="30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Bamboo sieve below: thick rim -->
    <circle cx="40" cy="58" r="19" fill="currentColor" fill-opacity="0.10"
            stroke="currentColor" stroke-width="6"/>
    <!-- Woven grid on surface -->
    <line x1="30" y1="51" x2="50" y2="51" stroke="currentColor" stroke-width="1.2" opacity="0.28"/>
    <line x1="28" y1="58" x2="52" y2="58" stroke="currentColor" stroke-width="1.2" opacity="0.28"/>
    <line x1="30" y1="65" x2="50" y2="65" stroke="currentColor" stroke-width="1.2" opacity="0.28"/>
    <line x1="35" y1="39" x2="35" y2="77" stroke="currentColor" stroke-width="1.2" opacity="0.28"/>
    <line x1="40" y1="39" x2="40" y2="77" stroke="currentColor" stroke-width="1.2" opacity="0.28"/>
    <line x1="45" y1="39" x2="45" y2="77" stroke="currentColor" stroke-width="1.2" opacity="0.28"/>
    <!-- Leaf shapes on sieve -->
    <ellipse cx="36" cy="55" rx="5"   ry="2"   fill="currentColor" opacity="0.60"
             transform="rotate(-20 36 55)"/>
    <ellipse cx="46" cy="54" rx="4.5" ry="1.8" fill="currentColor" opacity="0.60"
             transform="rotate(15 46 54)"/>
    <ellipse cx="38" cy="63" rx="5"   ry="2"   fill="currentColor" opacity="0.55"
             transform="rotate(30 38 63)"/>
  </symbol>

