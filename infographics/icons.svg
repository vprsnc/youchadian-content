    <path d="M10 38 Q10 62 40 68 Q70 62 70 38"
          fill="currentColor" fill-opacity="0.14"
          stroke="currentColor" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Rim: ellipse across the top of the wok -->
    <ellipse cx="40" cy="38" rx="30" ry="10"
             fill="currentColor" fill-opacity="0.22"
             stroke="currentColor" stroke-width="4.5"/>
    <!-- Left handle stub -->
    <line x1="10" y1="38" x2="2" y2="33"
          stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Right handle stub -->
    <line x1="70" y1="38" x2="78" y2="33"
          stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Heat waves rising (3 sinuous lines) -->
    <path d="M26 30 Q23 21 26 12"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M40 28 Q37 19 40 10"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M54 30 Q57 21 54 12"
          fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  </symbol>

